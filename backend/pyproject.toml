[project]
name = "rpi-calendar-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-api-python-client>=2.100",
    "gunicorn>=25.3.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
fetch-key = [
    "google-auth>=2.49.1",
    "google-auth-httplib2>=0.3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
[tool.ruff]
line-length = 88